# What rustkube-node's suites need from the runner (stormcentral
# docs/test-standard.md, #55, #74). Everything else is the run's namespace.

[medium]
# Cluster-wide reads (get, list, watch): which Node STORM_NODE is, the
# built-in StorageClass, PVs (reclaim checks), kube-system's mirrored node
# volume claims (#59) and the node's CSIStorageCapacity (#62).
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "persistentvolumes" },
  { apiGroup = "", resource = "persistentvolumeclaims" },
  { apiGroup = "storage.k8s.io", resource = "storageclasses" },
  { apiGroup = "storage.k8s.io", resource = "csistoragecapacities" },
]

[short]
# Which Node STORM_NODE is, and its Ready/heartbeat/pressure (#61).
cluster_read = [
  { apiGroup = "", resource = "nodes" },
]

[long]
# The node's capacity (allocatable pods) and the pods already on it, which
# size each wave; the built-in StorageClass and the waves' PVs, which every
# drain checks are reclaimed (#61). The standard's 8 h night budget.
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "pods" },
  { apiGroup = "", resource = "persistentvolumes" },
  { apiGroup = "storage.k8s.io", resource = "storageclasses" },
]

[csi]
# The kubelet's CSI node side against this image's own driver (#52): a
# CSIDriver and a PV of it made by the suite (cluster_write, #479), which
# Node it is, and its CSINode (registration). The driver's pod (privileged,
# /var/lib/kubelet Bidirectional) and the kubelet-restart pod (privileged,
# hostPID) are pods the suite makes in its namespace; the runner itself needs
# nothing of the node. By day: 15 min.
budget_secs = 900
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "persistentvolumes" },
  { apiGroup = "storage.k8s.io", resource = "csinodes" },
  { apiGroup = "storage.k8s.io", resource = "csidrivers" },
]
cluster_write = [
  { apiGroup = "", resource = "persistentvolumes" },
  { apiGroup = "storage.k8s.io", resource = "csidrivers" },
]

[multus]
# A pod's extra networks (#233): NetworkAttachmentDefinitions are made in the
# run's namespace (its Role is `*`), so the only cluster read is which Node
# STORM_NODE is. Needs stormcos's NAD CRD and the standard CNI plugins in
# cni-bin (stormcos#495). By day: 10 min.
budget_secs = 600
cluster_read = [
  { apiGroup = "", resource = "nodes" },
]
