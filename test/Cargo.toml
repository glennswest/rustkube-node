[package]
name = "rustkube-node-test"
version = "0.1.0"
edition = "2021"
description = "rustkube-node's test container (stormcentral docs/test-standard.md): short, medium and long suites against the kubelet on a running node."
license = "Apache-2.0"
publish = false

# Its own workspace: the root workspace's builds never see it, and it has its
# own Cargo.lock (seeded from stormblock-csi's test crate, which uses the same
# four crates).
[workspace]

[lib]
name = "rustkube_node_test"
path = "src/lib.rs"

[[bin]]
name = "rustkube-node-test"
path = "src/main.rs"

# The kubelet is never linked in: it is reached through the Kubernetes API.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
libc = "0.2"
# The repository's one retry helper (#211): the apiserver being briefly away
# is retried, not reported as a failed test.
retry = { path = "../pkg/retry" }
# The csi suite's own CSI driver (#52, `csi_driver.rs`): a gRPC server on the
# vendored protos the kubelet speaks (`../pkg/kubelet/proto`), the same
# versions as the kubelet's.
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
strip = true

# Zero warnings (stormcentral#193): a warning fails the build.
[lints.rust]
warnings = "deny"
