# rustkube-node-test-<suite>: what a run of rustkube-node's tests looks like,
# per stormcentral docs/test-standard.md. **Reference only:** stormcentral
# builds the Job, its namespace-scoped Role and the cluster reads itself
# (src/testruns.rs), from test/requires.toml; it does not apply this file.
#
# Test metadata (what the runner matches against the machine):
#   suites:   short (< 2 min): Node Ready; a pod runs, reports exit codes,
#             serves its log and stops on delete (#61).
#             medium (< 30 min): claims of the built-in stormblock class at
#             every size class and arbitrary sizes (#64), the node's own
#             volumes (#59), and pod features and failure paths (#61).
#             long (night): waves of pods at the node's free capacity, start
#             latency and residue per wave (#61).
#   requires: []            (storage comes from the node's stormblock engine
#                            through the kubelet. Where the class is not
#                            offered — no StorageClass stormblock of
#                            stormblock.storm.io — medium's storage cases
#                            report one skip and long's waves have no claims.)
#   privileged: no          (the Job and its workload pods run unprivileged;
#                            workload pods run as uid 0 with no capabilities,
#                            to own a fresh filesystem's root)
#   api:      namespaced in the run's namespace: PVCs, pods, pods/log,
#             configmaps, events (read). Cluster reads per suite are in
#             test/requires.toml (nodes for all; pods on the node for long).
#             Cluster-scoped: read StorageClasses, CSIStorageCapacities and
#             PVs; read PVCs and
#             delete one of kube-system's mirrored node-volume claims, which
#             the kubelet makes again (#59; the PV is Retain).
#   images:   only ${IMAGE}: the workload pods run it too
#             (RUSTKUBE_NODE_TEST_IMAGE)
#   external: none
#
# The runner creates the namespace test-rustkube-node-<suite>-<run id>, fills
# in NAMESPACE / RUN_ID / NODE / API / SUITE / TIMEOUT / TIMEOUT_PLUS_MARGIN /
# COMMIT / IMAGE below, applies this, waits for the Job, collects /results
# with the logs, and deletes the namespace (which deletes the run's claims;
# their PVs are reclaimed), then the cluster-scoped objects by their
# storm.io/test-run label.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustkube-node-test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustkube-node-test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}" }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustkube-node-test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: rustkube-node-test }
subjects:
  - { kind: ServiceAccount, name: rustkube-node-test, namespace: "${NAMESPACE}" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustkube-node-test-${RUN_ID}
  labels: { storm.io/test-run: "${RUN_ID}" }
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  # node-volumes (#59): read kube-system's mirrored claims, and delete one to
  # see the kubelet make it again (its PV is Retain; no data is touched).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustkube-node-test-${RUN_ID}
  labels: { storm.io/test-run: "${RUN_ID}" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "rustkube-node-test-${RUN_ID}" }
subjects:
  - { kind: ServiceAccount, name: rustkube-node-test, namespace: "${NAMESPACE}" }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustkube-node-test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}" }
spec:
  backoffLimit: 0            # a retry would hide the finding
  activeDeadlineSeconds: ${TIMEOUT_PLUS_MARGIN}
  template:
    metadata:
      labels: { storm.io/test-run: "${RUN_ID}" }
    spec:
      restartPolicy: Never
      serviceAccountName: rustkube-node-test
      automountServiceAccountToken: true
      containers:
        - name: rustkube-node-test
          image: ${IMAGE}
          command: ["/test", "${SUITE}"]
          env:
            - { name: STORM_API, value: "${API}" }
            - { name: STORM_NAMESPACE, value: "${NAMESPACE}" }
            - { name: STORM_RUN_ID, value: "${RUN_ID}" }
            - { name: STORM_NODE, value: "${NODE}" }
            - { name: STORM_SUITE, value: "${SUITE}" }
            - { name: STORM_TIMEOUT, value: "${TIMEOUT}" }
            - { name: STORM_COMPONENT, value: rustkube-node }
            - { name: STORM_COMMIT, value: "${COMMIT}" }
            - { name: RUSTKUBE_NODE_TEST_IMAGE, value: "${IMAGE}" }
          volumeMounts:
            - { name: results, mountPath: /results }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: results, emptyDir: {} }
