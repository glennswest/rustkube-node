[workspace]
resolver = "2"
members = [
    "pkg/kubelet",
    "pkg/proxy",
    "pkg/cni",
    "cmd/kubelet",
    "cmd/kube-proxy",
]

# Release profile — the node's binaries land in a read-only erofs root, so
# whatever ships is what every node carries for the life of the image; there is
# no package manager to slim it down later (#30).
#
# `strip = "debuginfo"` rather than `strip = true`: the DWARF goes, the symbol
# table stays, so a panic on a node names the functions in its backtrace
# instead of printing addresses. Measured on the kubelet: 16.6 MiB as built,
# 14.0 MiB if the symbols went too — 2.6 MiB for a readable backtrace on a
# machine that cannot run a debugger against the binary anyway.
#
# `debug = "line-tables-only"` is carried for the same reason rustkube carries
# it, but be clear about what it does here: `strip = "debuginfo"` removes the
# line tables again, so backtraces resolve to functions, not to file and line.
# Dropping the strip is what would buy file:line, at the cost of the DWARF.
#
# Thin LTO and one codegen unit are the part that might actually matter — the
# kubelet and kube-proxy are on the node's hot path — rather than the size,
# which is under 0.3% of the image and compressed besides.
#
# Matches rustkube's profile deliberately: the two halves of one control plane
# should not be built to different settings.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
debug = "line-tables-only"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/glennswest/rustkube-node"

[workspace.dependencies]
# Shared types — sibling path dep on rustkube's apimachinery crate (single
# source of truth; matches the multi-repo path-dep pattern used across the
# effort). Requires the `rustkube` repo checked out as a sibling directory.
apimachinery = { path = "../rustkube/pkg/apimachinery" }

# Internal libs (pkg/) — consumed by the cmd/ binary crates
kubelet = { path = "pkg/kubelet" }
proxy = { path = "pkg/proxy" }
cni = { path = "pkg/cni" }

# Kubernetes types — pinned to K8s 1.32 (must match rustkube/apimachinery)
k8s-openapi = { version = "0.24", features = ["v1_32"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# gRPC (CRI client)
tonic = { version = "0.12", features = ["tls"] }
tonic-build = { version = "0.12" }
prost = { version = "0.13" }
prost-types = { version = "0.13" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# Observability
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = { version = "0.24" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utilities
rand = { version = "0.8" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = { version = "0.22" }
bytes = { version = "1" }
futures = { version = "0.3" }
async-trait = { version = "0.1" }
dashmap = { version = "6" }
parking_lot = { version = "0.12" }
url = { version = "2" }
regex = { version = "1" }

# Networking
nix = { version = "0.29", features = ["net", "socket", "ioctl", "process"] }
rtnetlink = { version = "0.14" }
socket2 = { version = "0.5" }
ipnet = { version = "2" }

# OCI container runtime (youki libcontainer)
libcontainer = { version = "0.6", default-features = false, features = ["v2"] }
oci-spec = { version = "0.9" }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# TLS (rustls only — no OpenSSL)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }

# Testing
tempfile = { version = "3" }
