[package]
name = "kubelet"
description = "Node agent for RustKube (CRI client, pod lifecycle)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The node's execution engine. Depended on for its ring client and spec
# encoding rather than for the engine itself — its whole dependency set is
# libc plus two crates with none of their own, so this costs the kubelet
# almost nothing.
stormpump = { git = "https://github.com/glennswest/stormpump", branch = "main" }
stormpump-abi = { git = "https://github.com/glennswest/stormpump", branch = "main" }
# The VM object, its conversion from a Kubernetes object, and the plan that
# turns it into a stormpump spec. Libraries: the loop is this kubelet's.
stormvm-spec = { git = "https://github.com/glennswest/stormvm", branch = "main" }
stormvm-node = { git = "https://github.com/glennswest/stormvm", branch = "main" }
# Tap naming, MAC derivation and the ioctls that make one. Shared with the
# standalone `stormvm start` path deliberately: the two must not derive
# different names for one VM (rustkube-node#39).
stormvm-net = { git = "https://github.com/glennswest/stormvm", branch = "main" }
stormvm-cloudinit = { git = "https://github.com/glennswest/stormvm", branch = "main" }
apimachinery = { workspace = true }
cni = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tower = { version = "0.5" }
hyper-util = { version = "0.1" }
# The console doors themselves — serial and VNC — mounted in this server
# rather than dialled over loopback (rustkube-node#43). There is no standalone
# node: every node runs rustkube, so every node that runs a VM has a kubelet
# on it, and a second long-lived process to serve consoles is one that never
# needs to exist. Mounted here the doors also inherit this server's TLS and
# bearer auth instead of stormvm's weaker "loopback, or a token" rule.
stormvm-console = { git = "https://github.com/glennswest/stormvm", branch = "main" }
# `hyper::upgrade::OnUpgrade`, by name. Handing a request to the console's
# router means rebuilding it without this server's path captures, and the
# upgrade handle is the one extension that has to survive that — without it
# the WebSocket the route exists for cannot be completed.
hyper = { version = "1" }
# axum 0.8, matching stormvm-console and the apiserver. A 0.8 `Router` cannot
# nest in a 0.7 one, which is the whole reason the console used to be reached
# over a socket. Note the path syntax: 0.8 spells a parameter `{p}`, where 0.7
# spelled it `:p` and read braces as a literal segment.
axum = { version = "0.8" }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { workspace = true }
rcgen = "0.13"
tokio = { workspace = true }
# ReceiverStream, so a followed log can be handed to axum as a body stream.
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }


[target.'cfg(target_os = "linux")'.dependencies]
libcontainer = { workspace = true }
oci-spec = { workspace = true }
nix = { workspace = true }
libc = "0.2"

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }

[build-dependencies]
tonic-build = { workspace = true }
